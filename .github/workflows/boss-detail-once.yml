name: One-time boss detail polish
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch-boss:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add boss detail hook
        shell: python
        run: |
          from pathlib import Path
          p=Path('src/main.js')
          s=p.read_text()
          marker='// FINAL BOSS DETAIL POLISH v1'
          if marker in s:
              print('Boss detail already patched')
              raise SystemExit(0)
          needle='createEnemy("elite",0,-101,110);'
          patch=r'''createEnemy("elite",0,-101,110);
// FINAL BOSS DETAIL POLISH v1
{
  const boss=enemies[enemies.length-1];
  if(boss?.group){
    const armorMat=mat(0x171a31,0x3d0a55,.32), edgeMat=mat(0x45f6ef,0x087d88,.28), coreMat=mat(0xff4fd8,0x9c126f,.22);
    const g=boss.group;
    const shell=g.children[0];
    if(shell){shell.scale.set(1.08,1.05,1.05);shell.material=armorMat;}
    const chest=new THREE.Mesh(new THREE.BoxGeometry(1.0,.78,.14),armorMat);chest.position.set(0,1.0,-.52);g.add(chest);
    const core=new THREE.Mesh(new THREE.OctahedronGeometry(.28,1),coreMat);core.position.set(0,1.02,-.63);g.add(core);
    const visor=new THREE.Mesh(new THREE.BoxGeometry(.86,.16,.12),edgeMat);visor.position.set(0,1.62,-.48);g.add(visor);
    const shoulderGeo=new THREE.SphereGeometry(.36,16,10);
    for(const side of [-1,1]){const sh=new THREE.Mesh(shoulderGeo,armorMat);sh.scale.set(1,.72,.9);sh.position.set(side*.88,1.22,0);g.add(sh);const blade=new THREE.Mesh(new THREE.BoxGeometry(.08,.7,.18),edgeMat);blade.position.set(side*1.08,1.5,0);g.add(blade);}
    const reactorRing=new THREE.Mesh(new THREE.TorusGeometry(.62,.06,10,28),edgeMat);reactorRing.rotation.x=Math.PI/2;reactorRing.position.set(0,.62,0);g.add(reactorRing);
    const coreLight=new THREE.PointLight(0xff4fd8,5,8);coreLight.position.set(0,1.05,-.8);g.add(coreLight);
    g.userData.bossDetailed=true;
  }
}
'''
          if needle not in s:
              raise SystemExit('Boss insertion point not found')
          p.write_text(s.replace(needle,patch,1))
      - name: Commit boss detail
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/main.js
          git commit -m 'Polish final boss visual detail'
          git push
